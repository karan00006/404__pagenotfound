<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell d-flex align-items-center justify-content-center">
      <section class="terminal-card w-100">
        <div
          class="terminal-header d-flex align-items-center justify-content-between flex-wrap gap-2"
        >
          <div class="dots d-flex align-items-center gap-2">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <span class="badge text-info border border-info-subtle sys-chip"
            >SYS::404_HANDLER</span
          >
        </div>

        <div class="content-wrap text-center text-sm-start">
          <img
            src="./assets/insta-logo.jpg"
            alt="4o4 page logo"
            class="hero-logo d-block mx-auto mx-sm-0"
          />

          <h1 class="page-title mt-3 mb-2">Text not found</h1>

          <p class="lead-copy mb-3">
            Error 404: Normal life not found 😂<br />
            💻 Dev memes • Code motivation • Tech vibes<br />
            🚀 Building cool stuff daily<br />
            👇 Join the debug squad
          </p>

          <div
            class="status-row d-flex flex-column flex-sm-row justify-content-center justify-content-sm-start gap-2 mb-3"
          >
            <span class="badge status-badge status-cyan">STATUS: NOT_FOUND</span>
            <span class="badge status-badge status-green">UPTIME: 99.99%</span>
          </div>

          <div class="d-flex flex-column flex-sm-row gap-2 mb-2">
            <a
              class="btn btn-primary btn-lg action-btn"
              href="https://www.instagram.com/4o4__pagenotfound"
              target="_blank"
              rel="noopener noreferrer"
              >Return to Home</a
            >
            <button class="btn btn-outline-light btn-lg action-btn" id="runDiagnosticsBtn">
              Run Diagnostics
            </button>
          </div>

          <a
            href="https://www.instagram.com/4o4__pagenotfound"
            target="_blank"
            rel="noopener noreferrer"
            class="insta-handle d-inline-flex align-items-center gap-2"
          >
            <img src="./assets/insta-logo.jpg" alt="4o4 page logo" class="insta-mini-logo" />
            @4o4__pagenotfound
          </a>
        </div>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
